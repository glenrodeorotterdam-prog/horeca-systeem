<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1324">
<title>Horeca Systeem</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#10151a;
  --panel:#080d10;
  --panel2:#111820;
  --navy:#0f1324;
  --text:#f5f5f5;
  --muted:#a9adb2;
  --line:#263038;
  --accent:#7167ff;
  --danger:#d9534f;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
  padding-bottom:95px;
}

header{
  background:var(--navy);
  padding:30px 24px 28px;
}

.logo{
  font-size:13px;
  letter-spacing:4px;
  opacity:.7;
}

header h1{
  margin:8px 0 0;
  font-size:40px;
  line-height:1;
}

main{
  padding:24px;
  max-width:1000px;
  margin:auto;
}

.search{
  width:100%;
  padding:18px 20px;
  border:0;
  outline:none;
  border-radius:20px;
  background:var(--panel);
  color:white;
  font-size:18px;
  margin-bottom:20px;
}

.search::placeholder{
  color:#999;
}

.card{
  background:var(--panel);
  border-radius:24px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.label{
  color:#aeb2b7;
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.big{
  font-size:42px;
  font-weight:800;
  margin-top:12px;
}

h2{
  font-size:30px;
  margin:34px 0 18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.module{
  background:var(--panel);
  border:0;
  border-radius:22px;
  padding:24px;
  color:white;
  text-align:left;
  min-height:165px;
  font-size:17px;
  box-shadow:0 8px 25px rgba(0,0,0,.16);
}

.module:active{
  transform:scale(.98);
}

.icon{
  font-size:34px;
  display:block;
  margin-bottom:18px;
}

.module strong{
  display:block;
  font-size:22px;
  margin-bottom:7px;
}

.module span{
  color:#aeb2b7;
  line-height:1.35;
}

.inventory{
  background:var(--panel);
  border-radius:24px;
  padding:20px 18px;
}

.item{
  padding:20px 10px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.item:last-child{
  border-bottom:0;
}

.item-name{
  font-size:20px;
  font-weight:700;
}

.item-meta{
  color:#aeb2b7;
  margin-top:5px;
  font-size:14px;
}

.item-price{
  font-size:19px;
  font-weight:700;
  white-space:nowrap;
}

.primary{
  width:100%;
  border:0;
  border-radius:18px;
  background:var(--navy);
  color:white;
  padding:18px;
  font-size:18px;
  font-weight:700;
  margin-top:20px;
}

.secondary{
  border:1px solid #303941;
  background:#161d23;
  color:white;
  border-radius:14px;
  padding:12px 16px;
}

.danger{
  background:var(--danger);
  color:white;
  border:0;
  border-radius:12px;
  padding:10px 13px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.form input,
.form select{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #303941;
  background:#080d10;
  color:white;
  font-size:16px;
}

.form label{
  color:#b9bdc2;
  font-size:14px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.stat{
  background:var(--panel);
  border-radius:20px;
  padding:20px;
}

.stat small{
  color:#999;
}

.stat strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}

.empty{
  color:#999;
  padding:25px 10px;
  text-align:center;
}

nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  height:88px;
  background:#080d10;
  border-top:1px solid #303941;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

nav button{
  border:0;
  background:none;
  color:#aeb2b7;
  font-size:14px;
}

nav b{
  display:block;
  font-size:25px;
  margin-bottom:4px;
}

.modal{
  position:fixed;
  z-index:50;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:flex-end;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:#10151a;
  border-radius:28px 28px 0 0;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#252d34;
  color:white;
  font-size:22px;
}

.toast{
  position:fixed;
  z-index:100;
  left:20px;
  right:20px;
  bottom:105px;
  background:#fff;
  color:#111;
  padding:15px;
  border-radius:15px;
  text-align:center;
  font-weight:700;
  display:none;
}

.toast.show{
  display:block;
}

.hidden{
  display:none!important;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:420px){
  main{
    padding:18px;
  }

  header{
    padding:28px 20px;
  }

  header h1{
    font-size:36px;
  }

  .big{
    font-size:36px;
  }

  .module{
    padding:20px;
    min-height:150px;
  }

  .module strong{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">HORECA SYSTEEM</div>
  <h1 id="pageTitle">Dashboard</h1>
</header>

<main>

<section id="dashboard">

<input
  id="search"
  class="search"
  placeholder="🔎  Zoek product..."
  oninput="searchProducts()"
>

<div class="card">
  <div class="label">Totale voorraadwaarde</div>
  <div class="big" id="totalValue">€ 0,00</div>
</div>

<h2>Modules</h2>

<div class="grid">

<button class="module" onclick="openModule('voorraad')">
  <span class="icon">📦</span>
  <strong>Voorraad</strong>
  <span>Keuken, wijn & drank</span>
</button>

<button class="module" onclick="openModule('keuken')">
  <span class="icon">👨‍🍳</span>
  <strong>Keuken</strong>
  <span>Producten & porties</span>
</button>

<button class="module" onclick="openModule('wijn')">
  <span class="icon">🍷</span>
  <strong>Wijn</strong>
  <span>Flessen & wijnkaart</span>
</button>

<button class="module" onclick="openModule('dranken')">
  <span class="icon">🥃</span>
  <strong>Dranken</strong>
  <span>Barvoorraad</span>
</button>

<button class="module" onclick="openModule('leveranciers')">
  <span class="icon">🚚</span>
  <strong>Leveranciers</strong>
  <span>Inkoopprijzen</span>
</button>

<button class="module" onclick="openModule('rapporten')">
  <span class="icon">📊</span>
  <strong>Rapporten</strong>
  <span>Waarde & verbruik</span>
</button>

</div>

<h2>Voorraad</h2>

<div class="inventory" id="dashboardItems"></div>

<button class="primary" onclick="openAddProduct()">
  ＋ Product toevoegen
</button>

</section>


<section id="modulePage" class="hidden">

<button class="secondary" onclick="goDashboard()">← Terug</button>

<div id="moduleContent"></div>

</section>

</main>


<nav>

<button onclick="goDashboard()">
  <b>⌂</b>
  Dashboard
</button>

<button onclick="openModule('voorraad')">
  <b>▣</b>
  Voorraad
</button>

<button onclick="openModule('rapporten')">
  <b>◔</b>
  Rapporten
</button>

</nav>


<div class="modal" id="productModal">

<div class="modal-box">

<div class="modal-head">
  <h2>Product toevoegen</h2>
  <button class="close" onclick="closeModal()">×</button>
</div>

<div class="form">

<label>Productnaam</label>
<input id="pName" placeholder="Bijv. Ossenhaas">

<label>Categorie</label>
<select id="pCategory">
  <option value="Keuken">Keuken</option>
  <option value="Wijn">Wijn</option>
  <option value="Drank">Drank</option>
  <option value="Overig">Overig</option>
</select>

<label>Hoeveelheid</label>
<input id="pQuantity" type="number" step="0.01" placeholder="Bijv. 12.5">

<label>Eenheid</label>
<select id="pUnit">
  <option value="kg">kg</option>
  <option value="liter">liter</option>
  <option value="flessen">flessen</option>
  <option value="stuks">stuks</option>
</select>

<label>Inkoopprijs per eenheid (€)</label>
<input id="pPrice" type="number" step="0.01" placeholder="Bijv. 23">

<label>Leverancier</label>
<input id="pSupplier" placeholder="Bijv. HANOS">
<label>Minimumvoorraad</label>
<input id="pMinimum" type="number" step="0.01" placeholder="Bijv. 5">

<button class="primary" onclick="saveProduct()">
  Product opslaan
</button>

</div>
</div>
</div>


<div class="toast" id="toast"></div>


<script>

let products = JSON.parse(
  localStorage.getItem("horecaProducts")
) || [

{
 name:"Ossenhaas",
 category:"Keuken",
 quantity:12.5,
 unit:"kg",
 price:23,
 supplier:"HANOS"
},

{
 name:"Chardonnay",
 category:"Wijn",
 quantity:24,
 unit:"flessen",
 price:13,
 supplier:"Wijnleverancier"
},

{
 name:"Gin",
 category:"Drank",
 quantity:6,
 unit:"flessen",
 price:28,
 supplier:"Drankleverancier"
}

];


function money(value){

return new Intl.NumberFormat("nl-NL",{
 style:"currency",
 currency:"EUR"
}).format(value);

}


function totalValue(){

return products.reduce(
  (sum,p)=>sum+(p.quantity*p.price),
  0
);

}


function saveData(){

localStorage.setItem(
  "horecaProducts",
  JSON.stringify(products)
);

}


function updateTotal(){

document.getElementById("totalValue").textContent =
  money(totalValue());

}


function renderDashboard(){

const container =
document.getElementById("dashboardItems");

if(!products.length){

container.innerHTML =
  '<div class="empty">Nog geen producten.</div>';

return;

}

container.innerHTML = products.map((p,index)=>`

<div class="item">

<div>

<div class="item-name">
${escapeHtml(p.name)}
</div>

<div class="item-meta">
${escapeHtml(p.category)}
 · ${p.quantity} ${escapeHtml(p.unit)}
${p.supplier ? " · "+escapeHtml(p.supplier) : ""}
</div>

</div>

<div>

<div class="item-price">
${money(p.quantity*p.price)}
</div>

<br>

<button
class="danger"
onclick="deleteProduct(${index})">
Verwijder
</button>

</div>

</div>

`).join("");

updateTotal();

}


function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function searchProducts(){

const q =
document.getElementById("search")
.value
.toLowerCase();

const container =
document.getElementById("dashboardItems");

const results =
products.filter(p=>
p.name.toLowerCase().includes(q) ||
p.category.toLowerCase().includes(q) ||
(p.supplier || "").toLowerCase().includes(q)
);

if(!results.length){

container.innerHTML =
'<div class="empty">Geen producten gevonden.</div>';

return;

}

container.innerHTML = results.map(p=>`

<div class="item">

<div>
<div class="item-name">
${escapeHtml(p.name)}
</div>

<div class="item-meta">
${escapeHtml(p.category)}
 · ${p.quantity} ${escapeHtml(p.unit)}
 · ${escapeHtml(p.supplier || "Geen leverancier")}
</div>
</div>

<div class="item-price">
${money(p.quantity*p.price)}
</div>

</div>

`).join("");

}


function openAddProduct(){

document.getElementById("productModal")
.classList.add("active");

}


function closeModal(){

document.getElementById("productModal")
.classList.remove("active");

}


function saveProduct(){

const name =
document.getElementById("pName").value.trim();

const category =
document.getElementById("pCategory").value;

const quantity =
parseFloat(document.getElementById("pQuantity").value);

const unit =
document.getElementById("pUnit").value;

const price =
parseFloat(document.getElementById("pPrice").value);

const supplier =
document.getElementById("pSupplier").value.trim();
const minimum =
parseFloat(document.getElementById("pMinimum").value) || 0;

if(!name || !quantity || !price){

showToast("Vul product, hoeveelheid en prijs in.");

return;

}


products.push({

name,
category,
quantity,
unit,
price,
supplier,
minimum
});


saveData();

renderDashboard();

closeModal();

document.getElementById("pName").value="";
document.getElementById("pQuantity").value="";
document.getElementById("pPrice").value="";
document.getElementById("pSupplier").value="";
document.getElementById("pMinimum").value="";
showToast("Product toegevoegd ✓");

}


function deleteProduct(index){

if(!confirm(
"Wil je dit product echt verwijderen?"
)) return;

products.splice(index,1);

saveData();

renderDashboard();

showToast("Product verwijderd");

}


function openModule(module){

document.getElementById("dashboard")
.classList.add("hidden");

document.getElementById("modulePage")
.classList.remove("hidden");

const content =
document.getElementById("moduleContent");

const title =
document.getElementById("pageTitle");


if(module==="voorraad"){

title.textContent="Voorraad";

content.innerHTML=`

<h2>Alle voorraad</h2>

<div class="stat-grid">

<div class="stat">
<small>Producten</small>
<strong>${products.length}</strong>
</div>

<div class="stat">
<small>Voorraadwaarde</small>
<strong>${money(totalValue())}</strong>
</div>

</div>

<div class="inventory" style="margin-top:20px">

${products.map((p,i)=>`

<div class="item">

<div>
<div class="item-name">${escapeHtml(p.name)}</div>

<div class="item-meta">
${escapeHtml(p.category)}
 · ${p.quantity} ${escapeHtml(p.unit)}${p.quantity <= p.minimum ? `<div class="item-meta">⚠️ Bijbestellen</div>` : ""}
</div>

<div class="item-meta">
Inkoop: ${money(p.price)} per ${escapeHtml(p.unit)}
</div>
<div class="item-meta">
Minimumvoorraad: ${p.minimum}
</div>
<div class="item-meta">
Leverancier: ${escapeHtml(p.supplier || "Onbekend")}
</div>
</div>
<div class="item-price">
${money(p.quantity*p.price)}
</div>

</div>

`).join("")}

</div>

<button class="primary"
onclick="openAddProduct()">
＋ Product toevoegen
</button>

`;

}


if(module==="keuken"){

title.textContent="Keuken";

const list =
products.filter(p=>p.category==="Keuken");

content.innerHTML=`

<h2>Keukenvoorraad</h2>

<p style="color:#aaa">
Hier gaan we de slimme keukenmodule verder bouwen.
</p>

<div class="inventory">

${list.length ? list.map(p=>`

<div class="item">

<div>
<div class="item-name">
👨‍🍳 ${escapeHtml(p.name)}
</div>

<div class="item-meta">
${p.quantity} ${escapeHtml(p.unit)}
</div>
</div>

<div class="item-price">
${money(p.quantity*p.price)}
</div>

</div>

`).join("") :
'<div class="empty">Geen keukenproducten.</div>'}

</div>

`;

}


if(module==="wijn"){

title.textContent="Wijn";

const list =
products.filter(p=>p.category==="Wijn");

content.innerHTML=`

<h2>Wijnvoorraad</h2>

<div class="inventory">

${list.length ? list.map(p=>`

<div class="item">

<div>
<div class="item-name">
🍷 ${escapeHtml(p.name)}
</div>

<div class="item-meta">
${p.quantity} ${escapeHtml(p.unit)}
 · ${escapeHtml(p.supplier || "")}
</div>
</div>

<div class="item-price">
${money(p.quantity*p.price)}
</div>

</div>

`).join("") :
'<div class="empty">Geen wijnproducten.</div>'}

</div>

<h2>Wijnkaart</h2>

<div class="card">
<p style="color:#aaa">
Binnenkort kunnen we hier automatisch per wijn
de streek, druif, rijping, smaakprofiel en
passende gerechten toevoegen.
</p>
</div>

`;

}


if(module==="dranken"){

title.textContent="Dranken";

const list =
products.filter(p=>p.category==="Drank");

content.innerHTML=`

<h2>Barvoorraad</h2>

<div class="inventory">

${list.length ? list.map(p=>`

<div class="item">

<div>
<div class="item-name">
🥃 ${escapeHtml(p.name)}
</div>

<div class="item-meta">
${p.quantity} ${escapeHtml(p.unit)}
</div>
</div>

<div class="item-price">
${money(p.quantity*p.price)}
</div>

</div>

`).join("") :
'<div class="empty">Geen drankproducten.</div>'}

</div>

`;

}


if(module==="leveranciers"){

title.textContent="Leveranciers";

const suppliers =
[...new Set(
products
.map(p=>p.supplier)
.filter(Boolean)
)];

content.innerHTML=`

<h2>Leveranciers</h2>

<div class="inventory">

${suppliers.length ? suppliers.map(s=>`

<div class="item">

<div class="item-name">
🚚 ${escapeHtml(s)}
</div>

<div class="item-meta">
${products.filter(p=>p.supplier===s).length}
 producten
</div>

</div>

`).join("") :
'<div class="empty">Nog geen leveranciers.</div>'}

</div>

`;

}


if(module==="rapporten"){

title.textContent="Rapporten";

const kitchenValue =
products
.filter(p=>p.category==="Keuken")
.reduce((s,p)=>s+p.quantity*p.price,0);

const wineValue =
products
.filter(p=>p.category==="Wijn")
.reduce((s,p)=>s+p.quantity*p.price,0);

const drinkValue =
products
.filter(p=>p.category==="Drank")
.reduce((s,p)=>s+p.quantity*p.price,0);

content.innerHTML=`

<h2>Voorraadrapport</h2>

<div class="stat-grid">

<div class="stat">
<small>Totale waarde</small>
<strong>${money(totalValue())}</strong>
</div>

<div class="stat">
<small>Keuken</small>
<strong>${money(kitchenValue)}</strong>
</div>

<div class="stat">
<small>Wijn</small>
<strong>${money(wineValue)}</strong>
</div>

<div class="stat">
<small>Drank</small>
<strong>${money(drinkValue)}</strong>
</div>

</div>

<h2>Producten</h2>

<div class="card">

<div class="item">
<span>Totale producten</span>
<strong>${products.length}</strong>
</div>

<div class="item">
<span>Keukenproducten</span>
<strong>
${products.filter(p=>p.category==="Keuken").length}
</strong>
</div>

<div class="item">
<span>Wijnproducten</span>
<strong>
${products.filter(p=>p.category==="Wijn").length}
</strong>
</div>

<div class="item">
<span>Drankproducten</span>
<strong>
${products.filter(p=>p.category==="Drank").length}
</strong>
</div>

</div>

`;

}

}


function goDashboard(){

document.getElementById("modulePage")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("pageTitle")
.textContent="Dashboard";

renderDashboard();

}


function showToast(message){

const toast =
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2200);

}

function changeStock(index, amount){
  const product = products[index];

  if(!product) return;

  product.quantity = Math.max(
    0,
    Number(product.quantity) + amount
  );

  saveData();
  renderDashboard();

  showToast(
    product.name +
    " voorraad aangepast naar " +
    product.quantity +
    " " +
    product.unit
  );
}


function renderDashboard(){

  const container =
    document.getElementById("dashboardItems");

  if(!products.length){

    container.innerHTML =
      '<div class="empty">Nog geen producten.</div>';

    updateTotal();
    return;
  }

  container.innerHTML = products.map((p,index)=>`

    <div class="item">

      <div>

        <div class="item-name">
          ${escapeHtml(p.name)}
        </div>

        <div class="item-meta">
          ${escapeHtml(p.category)}
          · ${p.quantity} ${escapeHtml(p.unit)}
          ${p.supplier
            ? " · " + escapeHtml(p.supplier)
            : ""}
        </div>

        <div style="
          display:flex;
          align-items:center;
          gap:10px;
          margin-top:14px;
        ">

          <button
            class="secondary"
            onclick="changeStock(${index},-1)"
            style="font-size:22px;padding:8px 15px;">
            −
          </button>

          <strong style="min-width:70px;text-align:center;">
            ${p.quantity} ${escapeHtml(p.unit)}
          </strong>

          <button
            class="secondary"
            onclick="changeStock(${index},1)"
            style="font-size:22px;padding:8px 15px;">
            +
          </button>

        </div>

      </div>

      <div>

        <div class="item-price">
          ${money(p.quantity * p.price)}
        </div>

        <br>

        <button
          class="danger"
          onclick="deleteProduct(${index})">
          Verwijder
        </button>

      </div>

    </div>

  `).join("");

  updateTotal();
}
renderDashboard();

</script>

</body>
</html>
